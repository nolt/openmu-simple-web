; PHP-FPM pool of openmu-simple-web. Replaces zz-docker.conf of the official image, which would
; listen on TCP port 9000 - on the shared Docker network anyone could talk to that port.
[global]
daemonize = no

[www]
; Socket in the volume shared with the nginx container only.
listen = /run/php-fpm/php-fpm.sock
listen.mode = 0666

; Workers start on demand and stop when idle, so the site needs little memory between visits.
pm = ondemand
; A request waits at most a few seconds for the game server, so a slow API can hold some workers;
; more of them keep the pages answering meanwhile (an idle worker costs no memory, see ondemand).
pm.max_children = 16
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Keep the container environment (OPENMU_API_URL, OPENMU_API_KEY, TRUSTED_PROXIES, TZ...).
clear_env = no
