# nginx of openmu-simple-web: serves wwwroot/ directly and hands everything else
# (the pages, /content.js and /api/...) to PHP-FPM through a socket shared by the two containers.
server {
    listen 8080;
    server_name _;
    root /app/wwwroot;
    server_tokens off;

    # The forms are a few hundred bytes; nothing bigger has to be accepted.
    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    # Only the site's own scripts, styles and pictures; inline style attributes are used by the pages.
    # A name which slipped through as markup still couldn't run a script.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;

    # Static files first; "/" and the page routes aren't files, so they go to PHP.
    location / {
        try_files $uri @php;
    }

    location @php {
        include fastcgi_params;
        # One front controller outside the web root - no other PHP file can be called.
        fastcgi_param SCRIPT_FILENAME /app/app/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php-fpm/php-fpm.sock;
    }
}
