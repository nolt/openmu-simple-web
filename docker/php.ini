; PHP settings of openmu-simple-web (mounted into conf.d of the official image).

; Errors go to the container log, never to the visitor.
display_errors = Off
log_errors = On
expose_php = Off

; The code is cached compiled; a changed file is picked up within 2 seconds, so an update is
; just "git pull" without a restart.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

memory_limit = 64M
post_max_size = 16K
upload_max_filesize = 0
file_uploads = Off
max_execution_time = 15
